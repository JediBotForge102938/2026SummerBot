plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
        vendor = JvmVendorSpec.BELLSOFT
    }
}

application {
    mainClass = 'virtual_robot.controller.VirtualRobotApplication'
    applicationDefaultJvmArgs = ['--add-modules=javafx.controls,javafx.fxml']
}

tasks.named('run', JavaExec) {
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('linux')) {
        def controllerMapping = '03000000120c0000182e000011010000,ZEROPLUS P4 Wired Gamepad,' +
                'a:b1,b:b2,back:b8,dpdown:h0.4,dpleft:h0.8,dpright:h0.2,dpup:h0.1,' +
                'guide:b12,leftshoulder:b4,leftstick:b10,lefttrigger:a3,leftx:a0,lefty:a1,' +
                'rightshoulder:b5,rightstick:b11,righttrigger:a4,rightx:a2,righty:a5,' +
                'start:b9,x:b0,y:b3,platform:Linux,'
        doFirst {
            def existing = environment['SDL_GAMECONTROLLERCONFIG']
            environment 'SDL_GAMECONTROLLERCONFIG',
                    existing ? "${controllerMapping}\n${existing}" : controllerMapping
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs = [
                    '../third_party/virtual_robot/Controller/src',
                    '../third_party/virtual_robot/TeamCode/src',
                    '../TeamCode/src/main/java',
                    'src/main/java'
            ]
            exclude 'virtual_robot/config/Config.java'
            exclude 'org/firstinspires/ftc/teamcode/control/DriveModePreferences.java'
            exclude 'org/firstinspires/ftc/teamcode/subsystems/ActiveRobotProfileSource.java'
            exclude 'org/firstinspires/ftc/teamcode/telemetry/TelemetryMarkup.java'
        }
        resources {
            srcDirs = [
                    '../third_party/virtual_robot/Controller/src',
                    'src/main/resources'
            ]
            exclude '**/*.java'
        }
    }
}

tasks.named('processResources') {
    from('../robot-configs') {
        include 'starterbot-drive-only.xml'
        into 'robot-configs'
    }
    from('../robot-configs') {
        include 'biobuzz-starterbot.xml', 'biobuzz-starterbot.profile.json',
                'biobuzz-competitionbot.xml', 'biobuzz-competitionbot.profile.json'
        into 'robot-configs'
    }
    from('../robot-configs') {
        include 'lessons/s2_04_configuration_exercise.xml'
        into 'robot-configs'
    }
}

dependencies {
    implementation fileTree(dir: '../third_party/virtual_robot/lib', include: ['*.jar'])
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
